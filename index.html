<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Concrete Calculator & Invoice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-card: #192237;
            --border: rgba(255, 255, 255, 0.08);
            --border-focus: #3b82f6;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --success: #10b981;
            --danger: #ef4444;
            --font-mono: 'JetBrains Mono', monospace;
            --radius: 12px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.4;
            padding-bottom: 110px;
        }

        /* Mobile Header */
        .top-bar {
            position: sticky;
            top: 0;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 40;
        }

        .brand-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--text);
        }

        .brand-sub {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        /* Container */
        .app-wrap {
            max-width: 600px;
            margin: 0 auto;
            padding: 12px;
        }

        /* Segmented Tab Switcher */
        .tab-pills {
            display: flex;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 3px;
            border-radius: var(--radius);
            margin-bottom: 14px;
            gap: 3px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-muted);
            border: none;
            background: transparent;
            border-radius: var(--radius-sm);
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--accent);
            color: #fff;
        }

        /* Card Wrapper */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            margin-bottom: 14px;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        /* Form Fields */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .field-group label {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        select {
            width: 100%;
            height: 42px;
            padding: 0 10px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: var(--border-focus);
        }

        /* Buttons */
        .btn {
            height: 38px;
            padding: 0 12px;
            border-radius: var(--radius-sm);
            font-size: 0.82rem;
            font-weight: 600;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-sm {
            height: 32px;
            padding: 0 8px;
            font-size: 0.75rem;
        }

        .btn-block {
            width: 100%;
            height: 44px;
            margin-top: 6px;
        }

        /* Compact Entry Cards (Replaces wide desktop tables) */
        .row-card {
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px;
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .row-card-top {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .row-card-sub {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            padding-top: 6px;
            border-top: 1px dashed var(--border);
        }

        .mono {
            font-family: var(--font-mono);
            font-weight: 600;
        }

        /* Floor Specifics */
        .floor-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 10px;
        }

        .subcat-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin: 12px 0 6px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .floor-footer {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px;
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Fixed Bottom Action Bar */
        .sticky-foot {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--border);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
            max-width: 600px;
            margin: 0 auto;
        }

        .foot-total-lbl {
            font-size: 0.72rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .foot-total-val {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--success);
            font-family: var(--font-mono);
        }

        /* Printable Invoice (A4 Standard) */
        #print-section {
            display: none;
            background: #fff;
            color: #000;
            padding: 20px;
            border-radius: var(--radius);
        }

        @media print {
            body {
                background: #fff !important;
                color: #000 !important;
                padding: 0 !important;
            }

            .top-bar,
            .sticky-foot,
            #edit-section,
            .btn {
                display: none !important;
            }

            #print-section {
                display: block !important;
                padding: 0 !important;
            }
        }

        .inv-table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            font-size: 0.8rem;
        }

        .inv-table th,
        .inv-table td {
            border: 1px solid #cbd5e1;
            padding: 6px;
            text-align: left;
        }

        .inv-table th {
            background: #f1f5f9;
        }
    </style>
</head>

<body>

    <!-- Sticky Top Header -->
    <header class="top-bar">
        <div>
            <div class="brand-title">Concrete Pro</div>
            <div class="brand-sub">Estimator & Client Bill</div>
        </div>
        <div style="display: flex; gap: 6px;">
            <button class="btn btn-secondary btn-sm" onclick="resetForm()">Reset</button>
            <button class="btn btn-primary btn-sm" onclick="printDoc()">🖨️ PDF</button>
        </div>
    </header>

    <main class="app-wrap">
        <!-- View Switcher -->
        <div class="tab-pills">
            <button class="tab-btn active" id="tab-btn-edit" onclick="setTab('edit')">Calculator</button>
            <button class="tab-btn" id="tab-btn-inv" onclick="setTab('inv')">Invoice Preview</button>
        </div>

        <!-- TAB 1: Mobile Calculator -->
        <div id="edit-section">
            <!-- Client & Site Details -->
            <div class="card">
                <div class="card-title">Project Details</div>
                <div class="field-group" style="margin-bottom: 8px;">
                    <label>Client Name</label>
                    <input type="text" id="meta-client" placeholder="e.g. Ramesh Kumar" oninput="saveData()">
                </div>
                <div class="field-group" style="margin-bottom: 8px;">
                    <label>Site Location</label>
                    <input type="text" id="meta-site" placeholder="e.g. Plot #42, Main Road" oninput="saveData()">
                </div>
                <div class="form-row" style="margin-bottom: 0;">
                    <div class="field-group">
                        <label>Bill / Est #</label>
                        <input type="text" id="meta-no" placeholder="EST-101" oninput="saveData()">
                    </div>
                    <div class="field-group">
                        <label>Date</label>
                        <input type="date" id="meta-date" oninput="saveData()">
                    </div>
                </div>
            </div>

            <!-- Slab Multiplier Config -->
            <div class="card">
                <div class="card-title">
                    <span>Slab Multipliers</span>
                    <button class="btn btn-secondary btn-sm" onclick="addThicknessRule()">+ Add</button>
                </div>
                <div id="thickness-list"></div>
            </div>

            <!-- Floors Container -->
            <div id="floors-container"></div>
            <button class="btn btn-primary btn-block" onclick="addFloor()">+ Add New Floor</button>

            <!-- Flat Rate Items: Pillars & Steps -->
            <div class="card" style="margin-top: 16px;">
                <div class="card-title">Pillars & Steps (Flat Unit Rates)</div>

                <div class="subcat-label">
                    <span>Pillars</span>
                    <button class="btn btn-secondary btn-sm" onclick="addPillar()">+ Add</button>
                </div>
                <div id="pillars-list"></div>
                <div style="text-align: right; font-size: 0.8rem; margin: 4px 0 10px 0;">
                    Pillars: <span class="mono" id="lbl-pillars-sub">₹0</span>
                </div>

                <div class="subcat-label">
                    <span>Steps</span>
                    <button class="btn btn-secondary btn-sm" onclick="addStep()">+ Add</button>
                </div>
                <div id="steps-list"></div>
                <div style="text-align: right; font-size: 0.8rem; margin-top: 4px;">
                    Steps: <span class="mono" id="lbl-steps-sub">₹0</span>
                </div>
            </div>
        </div>

        <!-- TAB 2: Mobile/A4 Invoice Preview -->
        <div id="print-section">
            <div
                style="display: flex; justify-content: space-between; border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: 12px;">
                <div>
                    <h2 style="font-size: 1.25rem; font-weight: 800;">CONCRETE WORK ESTIMATE</h2>
                    <p style="font-size: 0.8rem; color: #475569;">Structural & Area Measurement Bill</p>
                </div>
                <div style="text-align: right; font-size: 0.8rem;">
                    <div><strong>Bill #:</strong> <span id="prn-no"></span></div>
                    <div><strong>Date:</strong> <span id="prn-date"></span></div>
                </div>
            </div>

            <div
                style="background: #f8fafc; border: 1px solid #e2e8f0; padding: 8px; border-radius: 6px; margin-bottom: 12px; font-size: 0.85rem;">
                <div><strong>Client:</strong> <span id="prn-client"></span></div>
                <div><strong>Site:</strong> <span id="prn-site"></span></div>
            </div>

            <div id="prn-floors-table"></div>
            <div id="prn-units-table"></div>

            <div
                style="margin-top: 14px; border: 1px solid #000; padding: 10px; border-radius: 6px; font-size: 0.88rem; width: 260px; margin-left: auto;">
                <div style="display: flex; justify-content: space-between;">
                    <span>Floors Total:</span> <strong id="prn-floors-total">₹0</strong>
                </div>
                <div style="display: flex; justify-content: space-between;">
                    <span>Units Total:</span> <strong id="prn-units-total">₹0</strong>
                </div>
                <div
                    style="display: flex; justify-content: space-between; font-size: 1.05rem; border-top: 1px solid #000; margin-top: 6px; padding-top: 6px;">
                    <span>Grand Total:</span> <strong id="prn-grand-total">₹0</strong>
                </div>
            </div>
        </div>
    </main>

    <!-- Sticky Thumb Summary Bar -->
    <div class="sticky-foot">
        <div>
            <div class="foot-total-lbl">Grand Total</div>
            <div class="foot-total-val" id="foot-grand-val">₹0</div>
        </div>
        <button class="btn btn-primary" onclick="printDoc()">Share / Print</button>
    </div>

    <script>
        // 1 meter = 3.28084 feet
        const M_TO_FT = 3.28084;

        let appData = {
            meta: { client: '', site: '', invNo: 'EST-101', date: '' },
            slabMultipliers: [
                { id: '4in', label: '4"', multiplier: 1.0 },
                { id: '5in', label: '5"', multiplier: 1.25 },
                { id: '6in', label: '6"', multiplier: 1.5 }
            ],
            floors: [],
            pillars: [],
            steps: []
        };

        function init() {
            const saved = localStorage.getItem('concrete_mobile_data');
            if (saved) {
                try { appData = JSON.parse(saved); } catch (e) { resetForm(); }
            } else {
                resetForm();
            }
            renderAll();
        }

        function resetForm() {
            appData = {
                meta: {
                    client: 'Ramesh Kumar',
                    site: 'Plot #42, Main Site',
                    invNo: 'EST-101',
                    date: new Date().toISOString().split('T')[0]
                },
                slabMultipliers: [
                    { id: '4in', label: '4"', multiplier: 1.0 },
                    { id: '5in', label: '5"', multiplier: 1.25 },
                    { id: '6in', label: '6"', multiplier: 1.5 }
                ],
                floors: [
                    {
                        name: 'Ground Floor',
                        rate: 180,
                        slabs: [{ l: 10, b: 8, thick: '5in' }, { l: 4, b: 3.5, thick: '4in' }],
                        beams: [{ l: 6, b: 0.3 }, { l: 5, b: 0.3 }],
                        lintels: [{ l: 5, b: 0.25 }, { l: 3, b: 0.25 }],
                        sunshades: [{ l: 3, b: 0.6 }, { l: 2, b: 0.6 }],
                        layers: [{ l: 4, b: 3.5 }, { l: 2, b: 0.6 }, { l: 5, b: 2 }],
                        borders: []
                    }
                ],
                pillars: [10000, 10000, 10000, 10000, 10000, 10000],
                steps: Array(12).fill(1000)
            };
            saveData();
            renderAll();
        }

        function saveData() {
            appData.meta.client = document.getElementById('meta-client').value;
            appData.meta.site = document.getElementById('meta-site').value;
            appData.meta.invNo = document.getElementById('meta-no').value;
            appData.meta.date = document.getElementById('meta-date').value;
            localStorage.setItem('concrete_mobile_data', JSON.stringify(appData));
            updatePrintPreview();
        }

        function setTab(tab) {
            const isEdit = tab === 'edit';
            document.getElementById('edit-section').style.display = isEdit ? 'block' : 'none';
            document.getElementById('print-section').style.display = isEdit ? 'none' : 'block';
            document.getElementById('tab-btn-edit').classList.toggle('active', isEdit);
            document.getElementById('tab-btn-inv').classList.toggle('active', !isEdit);
            if (!isEdit) updatePrintPreview();
        }

        function printDoc() {
            setTab('inv');
            window.print();
        }

        /* Slab Multipliers */
        function renderMultipliers() {
            const wrap = document.getElementById('thickness-list');
            wrap.innerHTML = appData.slabMultipliers.map((m, idx) => `
        <div style="display:flex; gap:6px; margin-bottom:6px;">
          <input type="text" value="${m.label}" style="flex:1;" onchange="appData.slabMultipliers[${idx}].label=this.value; saveData(); renderFloors();">
          <input type="number" step="0.05" value="${m.multiplier}" style="width:90px;" oninput="appData.slabMultipliers[${idx}].multiplier=parseFloat(this.value)||0; saveData(); renderFloors();">
          <button class="btn btn-danger btn-sm" onclick="appData.slabMultipliers.splice(${idx},1); saveData(); renderMultipliers(); renderFloors();">×</button>
        </div>
      `).join('');
        }

        function addThicknessRule() {
            appData.slabMultipliers.push({ id: 'th_' + Date.now(), label: 'Custom', multiplier: 1.0 });
            saveData();
            renderMultipliers();
            renderFloors();
        }

        /* Floors */
        function addFloor() {
            appData.floors.push({
                name: `${appData.floors.length + 1}th Floor`,
                rate: 180,
                slabs: [], beams: [], lintels: [], sunshades: [], layers: [], borders: []
            });
            saveData();
            renderFloors();
        }

        function addRow(fIdx, cat) {
            if (cat === 'slabs') {
                const def = appData.slabMultipliers[0] ? appData.slabMultipliers[0].id : '';
                appData.floors[fIdx].slabs.push({ l: 0, b: 0, thick: def });
            } else if (cat === 'borders') {
                appData.floors[fIdx].borders.push({ l: 0 });
            } else {
                appData.floors[fIdx][cat].push({ l: 0, b: 0 });
            }
            saveData();
            renderFloors();
        }

        function removeRow(fIdx, cat, rIdx) {
            appData.floors[fIdx][cat].splice(rIdx, 1);
            saveData();
            renderFloors();
        }

        function renderFloors() {
            const container = document.getElementById('floors-container');
            container.innerHTML = appData.floors.map((fl, fIdx) => {
                let fSqft = 0;

                // Render Slabs
                const slabCards = fl.slabs.map((r, rIdx) => {
                    const multObj = appData.slabMultipliers.find(m => m.id === r.thick);
                    const mult = multObj ? multObj.multiplier : 1.0;
                    const area = (r.l * M_TO_FT) * (r.b * M_TO_FT);
                    const eff = area * mult;
                    fSqft += eff;

                    const opts = appData.slabMultipliers.map(m =>
                        `<option value="${m.id}" ${m.id === r.thick ? 'selected' : ''}>${m.label} (×${m.multiplier})</option>`
                    ).join('');

                    return `
            <div class="row-card">
              <div class="row-card-top">
                <input type="number" step="0.01" placeholder="L (m)" value="${r.l || ''}" oninput="fl.slabs[${rIdx}].l=parseFloat(this.value)||0; recalculate();">
                <input type="number" step="0.01" placeholder="B (m)" value="${r.b || ''}" oninput="fl.slabs[${rIdx}].b=parseFloat(this.value)||0; recalculate();">
                <select onchange="fl.slabs[${rIdx}].thick=this.value; recalculate();">${opts}</select>
                <button class="btn btn-danger btn-sm" onclick="removeRow(${fIdx},'slabs',${rIdx})">×</button>
              </div>
              <div class="row-card-sub">
                <span>Area: <strong class="mono">${area.toFixed(1)}</strong> sqft</span>
                <span>Effective: <strong class="mono" style="color:var(--accent);">${eff.toFixed(1)}</strong> sqft</span>
              </div>
            </div>
          `;
                }).join('');

                // Standard categories generator
                const makeStdCards = (cat, mult) => fl[cat].map((r, rIdx) => {
                    const area = (r.l * M_TO_FT) * (r.b * M_TO_FT);
                    const eff = area * mult;
                    fSqft += eff;

                    return `
            <div class="row-card">
              <div class="row-card-top">
                <input type="number" step="0.01" placeholder="L (m)" value="${r.l || ''}" oninput="fl.${cat}[${rIdx}].l=parseFloat(this.value)||0; recalculate();">
                <input type="number" step="0.01" placeholder="B (m)" value="${r.b || ''}" oninput="fl.${cat}[${rIdx}].b=parseFloat(this.value)||0; recalculate();">
                <button class="btn btn-danger btn-sm" onclick="removeRow(${fIdx},'${cat}',${rIdx})">×</button>
              </div>
              <div class="row-card-sub">
                <span>Area: <strong class="mono">${area.toFixed(1)}</strong> sqft</span>
                <span>Effective (×${mult}): <strong class="mono" style="color:var(--accent);">${eff.toFixed(1)}</strong> sqft</span>
              </div>
            </div>
          `;
                }).join('');

                // Borders generator
                const borderCards = fl.borders.map((r, rIdx) => {
                    const direct = r.l * M_TO_FT;
                    fSqft += direct;
                    return `
            <div class="row-card">
              <div class="row-card-top">
                <input type="number" step="0.01" placeholder="Length (m)" value="${r.l || ''}" oninput="fl.borders[${rIdx}].l=parseFloat(this.value)||0; recalculate();">
                <button class="btn btn-danger btn-sm" onclick="removeRow(${fIdx},'borders',${rIdx})">×</button>
              </div>
              <div class="row-card-sub">
                <span>Direct ft Conversion</span>
                <span>Sqft: <strong class="mono" style="color:var(--accent);">${direct.toFixed(1)}</strong> sqft</span>
              </div>
            </div>
          `;
                }).join('');

                const fCost = Math.round(fSqft * (fl.rate || 0));

                return `
          <div class="card">
            <div class="floor-head">
              <input type="text" value="${fl.name}" style="background:transparent; border:none; font-size:1.05rem; font-weight:700; color:var(--text); width:150px;" onchange="fl.name=this.value; saveData();">
              <button class="btn btn-danger btn-sm" onclick="appData.floors.splice(${fIdx},1); saveData(); renderFloors();">Delete Floor</button>
            </div>

            <div class="subcat-label">
              <span>Slabs (${fl.slabs.length})</span>
              <button class="btn btn-secondary btn-sm" onclick="addRow(${fIdx}, 'slabs')">+ Add</button>
            </div>
            ${slabCards || '<div style="color:var(--text-muted); font-size:0.75rem;">No slabs</div>'}

            <div class="subcat-label">
              <span>Beams ×2 (${fl.beams.length})</span>
              <button class="btn btn-secondary btn-sm" onclick="addRow(${fIdx}, 'beams')">+ Add</button>
            </div>
            ${makeStdCards('beams', 2) || '<div style="color:var(--text-muted); font-size:0.75rem;">No beams</div>'}

            <div class="subcat-label">
              <span>Lintels ×1.5 (${fl.lintels.length})</span>
              <button class="btn btn-secondary btn-sm" onclick="addRow(${fIdx}, 'lintels')">+ Add</button>
            </div>
            ${makeStdCards('lintels', 1.5) || '<div style="color:var(--text-muted); font-size:0.75rem;">No lintels</div>'}

            <div class="subcat-label">
              <span>Sunshades ×1 (${fl.sunshades.length})</span>
              <button class="btn btn-secondary btn-sm" onclick="addRow(${fIdx}, 'sunshades')">+ Add</button>
            </div>
            ${makeStdCards('sunshades', 1) || '<div style="color:var(--text-muted); font-size:0.75rem;">No sunshades</div>'}

            <div class="subcat-label">
              <span>Layers ×1 (${fl.layers.length})</span>
              <button class="btn btn-secondary btn-sm" onclick="addRow(${fIdx}, 'layers')">+ Add</button>
            </div>
            ${makeStdCards('layers', 1) || '<div style="color:var(--text-muted); font-size:0.75rem;">No layers</div>'}

            <div class="subcat-label">
              <span>Borders (${fl.borders.length})</span>
              <button class="btn btn-secondary btn-sm" onclick="addRow(${fIdx}, 'borders')">+ Add</button>
            </div>
            ${borderCards || '<div style="color:var(--text-muted); font-size:0.75rem;">No borders</div>'}

            <div class="floor-footer">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:0.8rem; color:var(--text-muted);">Floor Sqft:</span>
                <span class="mono" style="font-size:1.05rem;">${fSqft.toFixed(1)} sqft</span>
              </div>
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:0.8rem; color:var(--text-muted);">Rate (₹/sqft):</span>
                <input type="number" value="${fl.rate}" style="width:100px; height:34px;" oninput="fl.rate=parseFloat(this.value)||0; recalculate();">
              </div>
              <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px dashed var(--border); padding-top:6px;">
                <span style="font-size:0.85rem; font-weight:700;">Floor Total:</span>
                <span class="mono" style="font-size:1.15rem; color:var(--success);">₹${fCost.toLocaleString('en-IN')}</span>
              </div>
            </div>
          </div>
        `;
            }).join('');

            recalculate();
        }

        /* Pillars & Steps */
        function renderPillars() {
            const wrap = document.getElementById('pillars-list');
            wrap.innerHTML = appData.pillars.map((p, idx) => `
        <div style="display:flex; gap:6px; margin-bottom:6px;">
          <input type="number" value="${p}" style="flex:1;" oninput="appData.pillars[${idx}]=parseFloat(this.value)||0; recalculate();">
          <button class="btn btn-danger btn-sm" onclick="appData.pillars.splice(${idx},1); recalculate(); renderPillars();">×</button>
        </div>
      `).join('');
        }

        function addPillar() {
            appData.pillars.push(0);
            recalculate();
            renderPillars();
        }

        function renderSteps() {
            const wrap = document.getElementById('steps-list');
            wrap.innerHTML = appData.steps.map((s, idx) => `
        <div style="display:flex; gap:6px; margin-bottom:6px;">
          <input type="number" value="${s}" style="flex:1;" oninput="appData.steps[${idx}]=parseFloat(this.value)||0; recalculate();">
          <button class="btn btn-danger btn-sm" onclick="appData.steps.splice(${idx},1); recalculate(); renderSteps();">×</button>
        </div>
      `).join('');
        }

        function addStep() {
            appData.steps.push(0);
            recalculate();
            renderSteps();
        }

        function recalculate() {
            let floorsTotal = 0;
            appData.floors.forEach(fl => {
                let fSqft = 0;
                fl.slabs.forEach(r => {
                    const m = appData.slabMultipliers.find(item => item.id === r.thick);
                    fSqft += ((r.l * M_TO_FT) * (r.b * M_TO_FT)) * (m ? m.multiplier : 1.0);
                });
                fl.beams.forEach(r => fSqft += ((r.l * M_TO_FT) * (r.b * M_TO_FT)) * 2);
                fl.lintels.forEach(r => fSqft += ((r.l * M_TO_FT) * (r.b * M_TO_FT)) * 1.5);
                fl.sunshades.forEach(r => fSqft += ((r.l * M_TO_FT) * (r.b * M_TO_FT)) * 1);
                fl.layers.forEach(r => fSqft += ((r.l * M_TO_FT) * (r.b * M_TO_FT)) * 1);
                fl.borders.forEach(r => fSqft += (r.l * M_TO_FT));

                floorsTotal += Math.round(fSqft * (fl.rate || 0));
            });

            const pillarsTotal = appData.pillars.reduce((a, b) => a + (parseFloat(b) || 0), 0);
            const stepsTotal = appData.steps.reduce((a, b) => a + (parseFloat(b) || 0), 0);
            const grandTotal = floorsTotal + pillarsTotal + stepsTotal;

            document.getElementById('lbl-pillars-sub').textContent = '₹' + pillarsTotal.toLocaleString('en-IN');
            document.getElementById('lbl-steps-sub').textContent = '₹' + stepsTotal.toLocaleString('en-IN');
            document.getElementById('foot-grand-val').textContent = '₹' + grandTotal.toLocaleString('en-IN');

            saveData();
        }

        function updatePrintPreview() {
            const m = appData.meta;
            document.getElementById('prn-client').textContent = m.client || '—';
            document.getElementById('prn-site').textContent = m.site || '—';
            document.getElementById('prn-no').textContent = m.invNo || 'EST-101';
            document.getElementById('prn-date').textContent = m.date || '—';

            let floorsHtml = '';
            let floorsTot = 0;

            appData.floors.forEach(fl => {
                let fSqft = 0;
                let rows = '';

                const append = (name, l, b, mult, note) => {
                    let eff = 0;
                    if (note === 'Border') {
                        eff = l * M_TO_FT;
                        rows += `<tr><td>${name}</td><td>${l}m</td><td>Direct</td><td>${eff.toFixed(1)} sqft</td></tr>`;
                    } else {
                        const area = (l * M_TO_FT) * (b * M_TO_FT);
                        eff = area * mult;
                        rows += `<tr><td>${name}</td><td>${l}m × ${b}m</td><td>× ${mult}</td><td>${eff.toFixed(1)} sqft</td></tr>`;
                    }
                    fSqft += eff;
                };

                fl.slabs.forEach((r, idx) => {
                    const mObj = appData.slabMultipliers.find(item => item.id === r.thick);
                    append(`Slab #${idx + 1}`, r.l, r.b, mObj ? mObj.multiplier : 1.0);
                });
                fl.beams.forEach((r, idx) => append(`Beam #${idx + 1}`, r.l, r.b, 2));
                fl.lintels.forEach((r, idx) => append(`Lintel #${idx + 1}`, r.l, r.b, 1.5));
                fl.sunshades.forEach((r, idx) => append(`Sunshade #${idx + 1}`, r.l, r.b, 1));
                fl.layers.forEach((r, idx) => append(`Layer #${idx + 1}`, r.l, r.b, 1));
                fl.borders.forEach((r, idx) => append(`Border #${idx + 1}`, r.l, 0, 1, 'Border'));

                const cost = Math.round(fSqft * (fl.rate || 0));
                floorsTot += cost;

                floorsHtml += `
          <div style="font-weight:700; font-size:0.9rem; margin-top:10px;">${fl.name} (Rate: ₹${fl.rate}/sqft)</div>
          <table class="inv-table">
            <thead><tr><th>Item</th><th>Dim</th><th>Mult</th><th>Sqft</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="4">No items</td></tr>'}</tbody>
            <tfoot>
              <tr style="font-weight:700; background:#f8fafc;">
                <td colspan="3" style="text-align:right;">Subtotal:</td>
                <td>${fSqft.toFixed(1)} sqft (₹${cost.toLocaleString('en-IN')})</td>
              </tr>
            </tfoot>
          </table>
        `;
            });

            document.getElementById('prn-floors-table').innerHTML = floorsHtml;

            const pTot = appData.pillars.reduce((a, b) => a + (parseFloat(b) || 0), 0);
            const sTot = appData.steps.reduce((a, b) => a + (parseFloat(b) || 0), 0);
            const unitsTot = pTot + sTot;

            document.getElementById('prn-units-table').innerHTML = `
        <div style="font-weight:700; font-size:0.9rem; margin-top:10px;">Pillars & Steps Flat Units</div>
        <table class="inv-table">
          <thead><tr><th>Item</th><th>Qty</th><th>Total</th></tr></thead>
          <tbody>
            <tr><td>Pillars</td><td>${appData.pillars.length} pcs</td><td>₹${pTot.toLocaleString('en-IN')}</td></tr>
            <tr><td>Steps</td><td>${appData.steps.length} pcs</td><td>₹${sTot.toLocaleString('en-IN')}</td></tr>
          </tbody>
        </table>
      `;

            document.getElementById('prn-floors-total').textContent = '₹' + floorsTot.toLocaleString('en-IN');
            document.getElementById('prn-units-total').textContent = '₹' + unitsTot.toLocaleString('en-IN');
            document.getElementById('prn-grand-total').textContent = '₹' + (floorsTot + unitsTot).toLocaleString('en-IN');
        }

        function renderAll() {
            document.getElementById('meta-client').value = appData.meta.client || '';
            document.getElementById('meta-site').value = appData.meta.site || '';
            document.getElementById('meta-no').value = appData.meta.invNo || 'EST-101';
            document.getElementById('meta-date').value = appData.meta.date || '';

            renderMultipliers();
            renderFloors();
            renderPillars();
            renderSteps();
            recalculate();
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
